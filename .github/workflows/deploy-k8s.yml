name: Reusable — Deploy to OVHcloud Kubernetes

on:
  workflow_call:
    inputs:
      namespace:
        required: true
        type: string
      manifests_path:
        required: false
        type: string
        default: k8s/
      app_label:
        required: false
        type: string
        default: ""
      deployment_name:
        required: false
        type: string
        default: ""
      image_tag:
        required: false
        type: string
        default: ""
        description: "Full immutable image reference (e.g. ghcr.io/owner/repo:sha). If set, kubectl set image is used to pin the deployment image."
      container_name:
        required: false
        type: string
        default: ""
        description: "Container name in the deployment to update with image_tag. Defaults to deployment_name when empty."
    secrets:
      KUBECONFIG_OVHCLOUD:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG_OVHCLOUD: ${{ secrets.KUBECONFIG_OVHCLOUD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBECONFIG_OVHCLOUD" | head -c 64 | grep -qE '^(apiVersion|kind|clusters|users|contexts):'; then
            printf '%s' "$KUBECONFIG_OVHCLOUD" > "$HOME/.kube/config"
          else
            printf '%s' "$KUBECONFIG_OVHCLOUD" | base64 -d > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
          kubectl version --client=true

      - name: Ensure namespace exists
        env:
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        env:
          MANIFESTS_PATH: ${{ inputs.manifests_path }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          kubectl apply -f "$MANIFESTS_PATH" -n "$NAMESPACE"

      - name: Pin deployment image to SHA tag
        if: inputs.image_tag != '' && inputs.deployment_name != ''
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOYMENT: ${{ inputs.deployment_name }}
          NAMESPACE: ${{ inputs.namespace }}
          CONTAINER_INPUT: ${{ inputs.container_name }}
        run: |
          set -euo pipefail
          CONTAINER="${CONTAINER_INPUT:-$DEPLOYMENT}"
          echo "Setting immutable image for deployment/$DEPLOYMENT container=$CONTAINER"
          kubectl -n "$NAMESPACE" set image deployment/"$DEPLOYMENT" "$CONTAINER=$IMAGE_TAG" --record=false

      - name: Force rollout restart only when no immutable image was provided
        if: inputs.image_tag == '' && inputs.deployment_name != ''
        env:
          DEPLOYMENT: ${{ inputs.deployment_name }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" rollout restart deployment/"$DEPLOYMENT"

      - name: Wait for rollout
        if: inputs.deployment_name != ''
        env:
          DEPLOYMENT: ${{ inputs.deployment_name }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          kubectl rollout status deployment/"$DEPLOYMENT" -n "$NAMESPACE" --timeout=300s

      - name: Debug on failure with redaction
        if: failure() && inputs.deployment_name != ''
        env:
          DEPLOYMENT: ${{ inputs.deployment_name }}
          NAMESPACE: ${{ inputs.namespace }}
          APP_LABEL: ${{ inputs.app_label != '' && inputs.app_label || inputs.deployment_name }}
        run: |
          set +e
          redact() { sed -E 's/(api[_-]?key|token|authorization|password|secret)[^[:space:]]*/[REDACTED]/Ig'; }
          echo "=== Deployment describe ==="
          kubectl -n "$NAMESPACE" describe deployment/"$DEPLOYMENT" 2>&1 | redact
          echo "=== Pods ==="
          kubectl -n "$NAMESPACE" get pods -l app="$APP_LABEL" -o wide 2>&1 | redact
          echo "=== Pod describe ==="
          kubectl -n "$NAMESPACE" describe pods -l app="$APP_LABEL" 2>&1 | redact
          echo "=== Pod logs (current) ==="
          kubectl -n "$NAMESPACE" logs -l app="$APP_LABEL" --tail=200 --all-containers=true 2>&1 | redact
          echo "=== Pod logs (previous) ==="
          kubectl -n "$NAMESPACE" logs -l app="$APP_LABEL" --previous --tail=200 --all-containers=true 2>&1 | redact
